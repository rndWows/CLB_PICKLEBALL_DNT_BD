<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Thu Chi Tồn Quỹ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/apexcharts/3.45.1/apexcharts.min.js"></script>
    <style>
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading.hidden {
            display: none;
        }

        .filter-drawer {
            transition: transform 0.3s ease-in-out;
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 50;
            overflow-y: auto;
        }

        @media (min-width: 768px) {
            .filter-drawer {
                width: 400px;
                right: -400px;
            }
        }

        .filter-drawer.open {
            transform: translateX(-100%);
        }

        .filter-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
            z-index: 40;
        }

        .filter-backdrop.show {
            opacity: 1;
            visibility: visible;
        }

        .filter-chip {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1rem;
            background: #f3f4f6;
            border-radius: 9999px;
            margin: 0.25rem;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .filter-chip:hover {
            background: #e5e7eb;
        }

        .filter-chip.active {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .date-input {
            position: relative;
        }

        .date-input input {
            padding-right: 2.5rem;
        }

        .date-input::after {
            content: "📅";
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #94a3b8 #f1f5f9;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #94a3b8;
            border-radius: 20px;
        }

        .table-container {
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: #94a3b8 #f1f5f9;
        }

        .table-container::-webkit-scrollbar {
            height: 8px;
        }

        .table-container::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .table-container::-webkit-scrollbar-thumb {
            background-color: #94a3b8;
            border-radius: 20px;
            border: 2px solid #f1f5f9;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
    </style>
</head>

<body class="bg-slate-50">

    <script>
        // Configuration
        const config = {
            appId: 'd9ee17ac-4397-452d-9e74-97997607fa4b',
            accessKey: 'V2-Rovhm-ZiLxx-msd7k-TSoig-NkECL-5LXEq-Kraws-yE09V',
            region: 'www'
        };

        // State management
        let currentData = [];
        let filteredData = [];
        let uniqueValues = {
            categories: new Set(),
            groups: new Set(),
            persons: new Set(),  // Thêm cái này
            sources: new Set(),  // Thêm cái này
        };

        // Loading indicator
        function toggleLoading(show) {
            document.getElementById('loading').classList.toggle('hidden', !show);
        }

        // Filter drawer management
        function toggleFilterDrawer(show) {
            const filterDrawer = document.getElementById('filterDrawer');
            const filterBackdrop = document.getElementById('filterBackdrop');
            filterDrawer.classList.toggle('open', show);
            filterBackdrop.classList.toggle('show', show);
            document.body.style.overflow = show ? 'hidden' : '';
        }

        // Fetch data from API
        async function fetchData() {
            toggleLoading(true);
            const tableName = encodeURIComponent("THU CHI TON QUY");

            try {
                const response = await fetch(
                    `https://api.appsheet.com/api/v2/apps/${config.appId}/tables/${tableName}/Action`,
                    {
                        method: 'POST',
                        headers: {
                            'ApplicationAccessKey': config.accessKey,
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            Action: 'Find',
                            Properties: {},
                            Selector: ''
                        })
                    }
                );

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                currentData = data;
                filteredData = [...currentData];

                populateFilters();
                updateDashboard();
                updateTable();
            } catch (error) {
                console.error('Failed to fetch data:', error);
                alert('Lỗi khi tải dữ liệu: ' + error.message);
            } finally {
                toggleLoading(false);
            }
        }

        // Populate filter options
        // Populate filter options  
        function populateFilters() {
            // Reset unique values
            Object.keys(uniqueValues).forEach(key => uniqueValues[key].clear());

            // Collect unique values from data  
            currentData.forEach(item => {
                if (item['Phân loại']) uniqueValues.categories.add(item['Phân loại']);
                if (item['Nhóm thu chi']) uniqueValues.groups.add(item['Nhóm thu chi']);

                // Gộp người chi và người nhận
                if (item['Người chi']) uniqueValues.persons.add(item['Người chi']);
                if (item['Người nhận']) uniqueValues.persons.add(item['Người nhận']);

                // Gộp nguồn chi và nguồn nhận
                if (item['Nguồn chi (TM/ Số TK)']) uniqueValues.sources.add(item['Nguồn chi (TM/ Số TK)']);
                if (item['Nguồn nhận (TM/ Số TK)']) uniqueValues.sources.add(item['Nguồn nhận (TM/ Số TK)']);
            });

            // Update select elements
            updateSelect('category', uniqueValues.categories);
            updateSelect('group', uniqueValues.groups);
            updateSelect('person', uniqueValues.persons);
            updateSelect('source', uniqueValues.sources);
        }

        // Update select element options
        function updateSelect(filterName, values) {
            const select = document.querySelector(`[data-filter="${filterName}"]`);
            const currentValue = select.value;
            select.innerHTML = '<option value="">Tất cả</option>' +
                Array.from(values)
                    .filter(Boolean)
                    .sort((a, b) => a.localeCompare(b, 'vi'))
                    .map(value => `<option value="${value}">${value}</option>`)
                    .join('');
            select.value = currentValue;
        }

        // Apply filters
        function applyFilters() {
            const filters = {
                startDate: document.querySelector('[data-filter="startDate"]').value,
                endDate: document.querySelector('[data-filter="endDate"]').value,
                category: document.querySelector('[data-filter="category"]').value,
                group: document.querySelector('[data-filter="group"]').value,
                person: document.querySelector('[data-filter="person"]').value,
                source: document.querySelector('[data-filter="source"]').value
            };

            filteredData = currentData.filter(item => {
                const itemDate = new Date(item['Ngày chứng từ']);

                if (filters.startDate) {
                    const startDate = new Date(filters.startDate);
                    startDate.setHours(0, 0, 0, 0);
                    if (itemDate < startDate) return false;
                }

                if (filters.endDate) {
                    const endDate = new Date(filters.endDate);
                    endDate.setHours(23, 59, 59, 999);
                    if (itemDate > endDate) return false;
                }

                if (filters.category && item['Phân loại'] !== filters.category) return false;
                if (filters.group && item['Nhóm thu chi'] !== filters.group) return false;

                // Kiểm tra người thực hiện (cả chi và nhận)
                if (filters.person && item['Người chi'] !== filters.person && item['Người nhận'] !== filters.person) return false;

                // Kiểm tra nguồn giao dịch (cả chi và nhận) 
                if (filters.source && item['Nguồn chi (TM/ Số TK)'] !== filters.source && item['Nguồn nhận (TM/ Số TK)'] !== filters.source) return false;

                return true;
            });

            updateActiveFilters();
            updateDashboard();
            updateTable();
            toggleFilterDrawer(false);
        }

        // Update active filters display
        function updateActiveFilters() {
            const activeFiltersContainer = document.getElementById('activeFilters');
            activeFiltersContainer.innerHTML = '';

            const filters = {
                'Phân loại': document.querySelector('[data-filter="category"]').value,
                'Nhóm': document.querySelector('[data-filter="group"]').value,
                'Người thực hiện': document.querySelector('[data-filter="person"]').value,
                'Nguồn giao dịch': document.querySelector('[data-filter="source"]').value
            };

            for (const [key, value] of Object.entries(filters)) {
                if (value) {
                    const chip = document.createElement('div');
                    chip.className = 'filter-chip active';
                    chip.innerHTML = `
                        ${key}: ${value}
                        <button class="ml-2 text-gray-500 hover:text-gray-700" data-remove="${key.toLowerCase()}">
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    `;
                    activeFiltersContainer.appendChild(chip);
                }
            }

            // Add event listeners for remove buttons
            document.querySelectorAll('[data-remove]').forEach(button => {
                button.addEventListener('click', (e) => {
                    const filterKey = e.currentTarget.dataset.remove;
                    const filterMap = {
                        'phân loại': 'category',
                        'nhóm': 'group',
                        'người thực hiện': 'person',
                        'nguồn giao dịch': 'source'
                    };

                    document.querySelector(`[data-filter="${filterMap[filterKey]}"]`).value = '';
                    applyFilters();
                });
            });
        }

        // Add print styles to head
        const printStyles = `

    /* Hide everything except print content */
    body > *:not(.print-content) {
        display: none !important;
    }

        padding: 20px;
        font-family: 'Times New Roman', Times, serif;

        margin-bottom: 20px;
    }

    .print-header h1,
    .print-header h2 {
        margin: 0;
        font-size: 16px;
        font-weight: bold;
    }

        width: 100%;

    }

        border: 1px solid black;

        page-break-before: always;

        // Thêm hàm tính số dư
        function calculateBalance(data) {
            let balance = 0;
            data.forEach(item => {
                const amount = parseFloat(String(item['Số tiền']).replace(/[^\d.-]/g, '')) || 0;
                if (item['Phân loại']?.toLowerCase() === 'thu') {
                    balance += amount;
                } else if (item['Phân loại']?.toLowerCase() === 'chi') {
                    balance -= amount;
                }
            });
            return balance;
        }

        function printReport() {
            // Get all data sorted by date
            const allData = currentData.sort((a, b) =>
                new Date(a['Ngày chứng từ']) - new Date(b['Ngày chứng từ'])
            );

            // Get filtered data date range
            const startDate = document.querySelector('[data-filter="startDate"]').value;
            const endDate = document.querySelector('[data-filter="endDate"]').value;

            // Nhóm dữ liệu theo nguồn giao dịch
            const sourceGroups = new Map();

            // Lấy nguồn giao dịch được chọn từ bộ lọc
            const selectedSource = document.querySelector('[data-filter="source"]').value;

            // Xử lý dữ liệu theo từng nguồn
            allData.forEach(item => {
                // Lấy nguồn từ cả nguồn chi và nguồn nhận
                const sources = new Set([
                    item['Nguồn chi (TM/ Số TK)'],
                    item['Nguồn nhận (TM/ Số TK)']
                ].filter(Boolean)); // Lọc bỏ giá trị null/undefined

                sources.forEach(source => {
                    if (!source) return;

                    if (!sourceGroups.has(source)) {
                        sourceGroups.set(source, {
                            openingBalance: 0,
                            income: 0,
                            expense: 0,
                            closingBalance: 0
                        });
                    }

        // Thêm hàm này vào phần JavaScript hiện có
        function updateWeeklyChart() {
            const weeklyData = {};

            // Xử lý dữ liệu theo tuần
            filteredData.forEach(item => {
                const date = new Date(item['Ngày chứng từ']);
                const weekKey = getWeekKey(date);

                if (!weeklyData[weekKey]) {
                    weeklyData[weekKey] = {
                        thu: 0,
                        chi: 0,
                        tonQuy: 0
                    };
                }

                const amount = parseFloat(String(item['Số tiền']).replace(/[^\d.-]/g, '')) || 0;
                if (item['Phân loại']?.toLowerCase() === 'thu') {
                    weeklyData[weekKey].thu += amount;
                } else if (item['Phân loại']?.toLowerCase() === 'chi') {
                    weeklyData[weekKey].chi += amount;
                }
            });

            // Tính tồn quỹ tích lũy
            let accumulatedBalance = 0;
            Object.keys(weeklyData).sort().forEach(week => {
                accumulatedBalance += weeklyData[week].thu - weeklyData[week].chi;
                weeklyData[week].tonQuy = accumulatedBalance;
            });

            // Chuẩn bị dữ liệu cho biểu đồ
            const weeks = Object.keys(weeklyData).sort().slice(-8); // Lấy 8 tuần gần nhất
            const thu = weeks.map(week => weeklyData[week].thu);
            const chi = weeks.map(week => weeklyData[week].chi);
            const tonQuy = weeks.map(week => weeklyData[week].tonQuy);

            // Cấu hình biểu đồ
            const options = {
                series: [
                    {
                        name: 'Thu',
                        type: 'column',
                        data: thu
                    },
                    {
                        name: 'Chi',
                        type: 'column',
                        data: chi
                    },
                    {
                        name: 'Tồn Quỹ',
                        type: 'line',
                        data: tonQuy
                    }
                ],
                chart: {
                    height: 400,
                    type: 'line',
                    stacked: false,
                    toolbar: {
                        show: true
                    }
                },
                stroke: {
                    width: [1, 1, 4],
                    curve: 'smooth'
                },
                plotOptions: {
                    bar: {
                        columnWidth: '50%'
                    }
                },
                colors: ['#22c55e', '#ef4444', '#3b82f6'],
                xaxis: {
                    categories: weeks.map(formatWeekLabel),
                    labels: {
                        rotate: -45,
                        style: {
                            fontSize: '12px'
                        }
                    }
                },
                yaxis: [
                    {
                        title: {
                            text: 'Thu/Chi (VNĐ)',
                            style: {
                                fontSize: '12px'
                            }
                        },
                        labels: {
                            formatter: function (value) {
                                return formatShortMoney(value);
                            }
                        }
                    }
                ],
                tooltip: {
                    y: {
                        formatter: function (value) {
                            return formatCurrency(value);
                        }
                    }
                },
                legend: {
                    position: 'top',
                    horizontalAlign: 'center'
                }
            };

            // Xóa biểu đồ cũ nếu có
            document.getElementById('weeklyChart').innerHTML = '';

            // Khởi tạo biểu đồ mới
            const chart = new ApexCharts(document.getElementById('weeklyChart'), options);
            chart.render();
        }

        // Thêm các hàm tiện ích
        function getWeekKey(date) {
            const firstDayOfWeek = new Date(date.setDate(date.getDate() - date.getDay()));
            return firstDayOfWeek.toISOString().split('T')[0];
        }

        function formatWeekLabel(weekKey) {
            const date = new Date(weekKey);
            return `Tuần ${getWeekNumber(date)}`;
        }

        function getWeekNumber(date) {
            const firstDayOfYear = new Date(date.getFullYear(), 0, 1);
            const pastDaysOfYear = (date - firstDayOfYear) / 86400000;
            return Math.ceil((pastDaysOfYear + firstDayOfYear.getDay() + 1) / 7);
        }

        function formatShortMoney(value) {
            if (Math.abs(value) >= 1000000000) {
                return (value / 1000000000).toFixed(1) + ' tỷ';
            } else if (Math.abs(value) >= 1000000) {
                return (value / 1000000).toFixed(1) + ' tr';
            }
            return value.toFixed(0);
        }

        // Animate value changes
        function animateValue(selector, endValue) {
            const element = document.querySelector(selector);
            const startValue = parseFloat(element.textContent.replace(/[^\d.-]/g, '')) || 0;
            const duration = 1000;
            const steps = 60;
            const increment = (endValue - startValue) / steps;

            let currentValue = startValue;
            const update = setInterval(() => {
                currentValue += increment;
                if ((increment > 0 && currentValue >= endValue) ||
                    (increment < 0 && currentValue <= endValue)) {
                    clearInterval(update);
                    currentValue = endValue;
                }
                element.textContent = formatCurrency(currentValue);
            }, duration / steps);
        }

        // Utility functions
        function formatCurrency(amount) {
            return new Intl.NumberFormat('vi-VN', {
                style: 'currency',
                currency: 'VND',
                maximumFractionDigits: 0
            }).format(amount || 0);
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleDateString('vi-VN', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });
        }

            script.onload = () => console.log('XLSX library loaded successfully');

                alert('Không thể tải thư viện xuất Excel. Vui lòng thử lại sau.');
            };

            // Set default date range

                firstDayOfMonth.toISOString().split('T')[0];
            document.querySelector('[data-filter="endDate"]').value =
                today.toISOString().split('T')[0];

            // Initialize table scrolling
            const tableContainer = document.querySelector('.table-container');
            if (tableContainer) {
                let isScrolling = false;
                let startX;
                let scrollLeft;

                tableContainer.addEventListener('mousedown', (e) => {
                    isScrolling = true;
                    startX = e.pageX - tableContainer.offsetLeft;
                    scrollLeft = tableContainer.scrollLeft;
                });

                tableContainer.addEventListener('mouseleave', () => {
                    isScrolling = false;
                });

                tableContainer.addEventListener('mouseup', () => {
                    isScrolling = false;
                });

                tableContainer.addEventListener('mousemove', (e) => {
                    if (!isScrolling) return;
                    e.preventDefault();
                    const x = e.pageX - tableContainer.offsetLeft;
                    const walk = (x - startX) * 2;
                    tableContainer.scrollLeft = scrollLeft - walk;
                });
            }

            // Handle network status
            window.addEventListener('online', () => {
                console.log('Back online, refreshing data...');
                fetchData();
            });

            window.addEventListener('offline', () => {
                console.log('Connection lost');
                alert('Mất kết nối mạng. Vui lòng kiểm tra kết nối internet của bạn.');
